<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 /// MISSING INGREDIENT</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-weight=%22bold%22 fill=%22%23ff3300%22 font-family=%22sans-serif%22>A</text></svg>"
    />

    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        cursor: none; /* Umpetin kursor asli */
      }
      .error-code {
        font-family: var(--font-display);
        font-size: 15vw;
        line-height: 0.8;
        color: var(--accent-color);
        margin-bottom: 0;
      }
      .error-msg {
        font-family: "Courier New", monospace;
        color: var(--mist-color);
        margin-top: 1rem;
        margin-bottom: 3rem;
        font-size: 1.2rem;
      }
      .back-btn {
        font-family: var(--font-display);
        font-size: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 1rem 3rem;
        transition: all 0.3s;
        cursor: none; /* Pastikan tombol juga ga munculin kursor tangan */
      }
      .back-btn:hover {
        background: var(--accent-color);
        color: black;
        border-color: var(--accent-color);
      }
    </style>
  </head>
  <body>
    <div id="cursor"></div>

    <div class="bg-grid"></div>
    <div class="bg-noise"></div>

    <h1 class="error-code hoverable">404</h1>
    <p class="error-msg">
      /// ERROR: LOST IN THE SAUCE.<br />This page hasn't been cooked yet.
    </p>

    <a href="index.html" class="back-btn hoverable">RETURN TO BASE</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
      // Cek apakah di Laptop (Layar Besar)
      if (window.matchMedia("(min-width: 768px)").matches) {
        const cursor = document.getElementById("cursor");
        const hoverables = document.querySelectorAll(".hoverable");

        // 1. RESET CSS BAWAAN (PENTING!)
        // Kita apus transform dari CSS biar GSAP ga bingung
        cursor.style.transform = "none";

        // 2. SET TITIK TENGAH (ANCHOR POINT)
        // Ini bikin kursor bener-bener di tengah, bukan di pinggir
        gsap.set(cursor, { xPercent: -50, yPercent: -50, opacity: 1 });

        // 3. GUNAKAN "QUICK TO" (Metode Paling Cepat & Akurat)
        const xTo = gsap.quickTo(cursor, "x", {
          duration: 0.1,
          ease: "power3",
        });
        const yTo = gsap.quickTo(cursor, "y", {
          duration: 0.1,
          ease: "power3",
        });

        // LOGIKA GERAK
        window.addEventListener("mousemove", (e) => {
          xTo(e.clientX);
          yTo(e.clientY);
        });

        // LOGIKA HOVER (Membesar)
        hoverables.forEach((el) => {
          el.addEventListener("mouseenter", () =>
            cursor.classList.add("hovered"),
          );
          el.addEventListener("mouseleave", () =>
            cursor.classList.remove("hovered"),
          );
        });
      }
    </script>
  </body>
</html>
