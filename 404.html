<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 /// MISSING INGREDIENT</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-weight=%22bold%22 fill=%22%23ff3300%22 font-family=%22sans-serif%22>A</text></svg>"
    />

    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        cursor: none; /* Umpetin kursor asli */
      }
      .error-code {
        font-family: var(--font-display);
        font-size: 15vw;
        line-height: 0.8;
        color: var(--accent-color);
        margin-bottom: 0;
      }
      .error-msg {
        font-family: "Courier New", monospace;
        color: var(--mist-color);
        margin-top: 1rem;
        margin-bottom: 3rem;
        font-size: 1.2rem;
      }
      .back-btn {
        font-family: var(--font-display);
        font-size: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 1rem 3rem;
        transition: all 0.3s;
        cursor: none; /* Pastikan tombol juga ga munculin kursor tangan */
      }
      .back-btn:hover {
        background: var(--accent-color);
        color: black;
        border-color: var(--accent-color);
      }
    </style>

    <style>
      /* ... style body, error-code, dll biarin aja ... */

      /* TAMBAHIN INI DI BAGIAN STYLE */
      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        /* Matikan transform CSS biar ga bentrok sama GSAP */
        transform: none !important;
        margin: 0 !important;
        /* Style standar kursor lu */
        width: 20px;
        height: 20px;
        background: var(--accent-color); /* Pake variabel warna lu */
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition:
          width 0.3s,
          height 0.3s; /* Biar hover effect tetep jalan */
      }
      #cursor.hovered {
        width: 80px;
        height: 80px;
        background: white;
        mix-blend-mode: difference;
      }
    </style>
  </head>
  <body>
    <div id="cursor"></div>

    <div class="bg-grid"></div>
    <div class="bg-noise"></div>

    <h1 class="error-code hoverable">404</h1>
    <p class="error-msg">
      /// ERROR: LOST IN THE SAUCE.<br />This page hasn't been cooked yet.
    </p>

    <a href="index.html" class="back-btn hoverable">RETURN TO BASE</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
      // Cek Laptop
      if (window.matchMedia("(min-width: 768px)").matches) {
        const cursor = document.getElementById("cursor");
        const hoverables = document.querySelectorAll(".hoverable");

        // --- KUNCINYA DI SINI ---
        // Kita paksa GSAP buat set titik anchor ke tengah.
        // xPercent/yPercent ini lebih kuat daripada CSS biasa.
        gsap.set(cursor, { xPercent: -50, yPercent: -50 });

        // LOGIKA GERAK (Pake to biasa aja biar stabil)
        window.addEventListener("mousemove", (e) => {
          gsap.to(cursor, {
            x: e.clientX, // Ikutin koordinat X mouse
            y: e.clientY, // Ikutin koordinat Y mouse
            duration: 0.15, // Sedikit delay biar smooth
            ease: "power2.out",
            overwrite: "auto", // Biar ga numpuk animasi
          });
        });

        // LOGIKA HOVER
        hoverables.forEach((el) => {
          el.addEventListener("mouseenter", () =>
            cursor.classList.add("hovered"),
          );
          el.addEventListener("mouseleave", () =>
            cursor.classList.remove("hovered"),
          );
        });
      }
    </script>
  </body>
</html>
